<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ForesightOS Technology Radar</title>
  <desc id="desc">A source-derived technology radar for a 24 to 36 month horizon. SiC Power Electronics is in Invest, AI Engineering Copilots and Zonal Architecture are in Experiment, and L4 Autonomous Logistics and Solid-State Batteries are in Monitor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10233b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { fill: #f8fafc; font-size: 30px; font-weight: 700; letter-spacing: .01em; }
      .sub { fill: #9fb2c7; font-size: 14px; }
      .axis { fill: #9fb2c7; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      .grid { fill: none; stroke: #36516d; stroke-width: 1; stroke-dasharray: 5 8; }
      .ring { fill: none; stroke: #57718b; stroke-width: 1.2; opacity: .8; }
      .label { fill: #dbeafe; font-size: 13px; font-weight: 600; }
      .detail { fill: #9fb2c7; font-size: 11px; }
      .legend { fill: #dbeafe; font-size: 12px; }
      .caption { fill: #6f8aa4; font-size: 10px; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="712" rx="20" fill="none" stroke="#29435e"/>

