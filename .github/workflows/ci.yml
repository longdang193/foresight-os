name: deterministic-ci

on:
  push:
  pull_request:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and build tools
        run: python -m pip install --upgrade pip build pytest && python -m pip install .
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run contract matrix
        run: python evaluation/run.py --matrix contract --output-root "$RUNNER_TEMP/foresight-contract"
      - name: Run controller matrix
        run: python evaluation/run.py --matrix controller
      - name: Run Analyst toolbelt probes
        run: |
          python evaluation/probes/run_toolbelt_probe.py --output-root "$RUNNER_TEMP/foresight-toolbelt"
          python evaluation/probes/run_evidence_workflow_probe.py --output-root "$RUNNER_TEMP/foresight-toolbelt"
          python evaluation/probes/run_xlsx_probe.py --output-root "$RUNNER_TEMP/foresight-toolbelt"
          python evaluation/probes/run_mcp_probe.py --mode disposable --output-root "$RUNNER_TEMP/foresight-toolbelt"
      - name: Build and smoke-test wheel
        shell: bash
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/wheel"
          python -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheel/*.whl
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json
          from importlib.resources import files
          import foresight_os
          import foresight_os.runtime.workflow
          for name in ("analysis.schema.json", "work_brief.schema.json"):
              json.loads(files("foresight_os.schemas").joinpath(name).read_text())
          print(foresight_os.__name__)
          PY
      - name: Check diff whitespace
        run: git diff --check
