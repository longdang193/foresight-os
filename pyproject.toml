[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foresight-os"
version = "0.1.0"
description = "Evidence-aware strategic reasoning prototype"
requires-python = ">=3.11"
dependencies = [
    "agent-framework==1.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
