[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foresight-os"
version = "0.1.0"
description = "Evidence-aware strategic reasoning prototype"
requires-python = ">=3.11"
dependencies = [
    "agent-framework==1.21.0",
    "filelock>=3,<4",
    "networkx>=3.6.1,<4",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.3.2,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
crawl = ["crawl4ai>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.setuptools.package-data]
foresight_os = ["schemas/*.json", "skills/manifest.json", "skills/*/SKILL.md"]
